server:
  port: 3001

spring:
  application:
    name: trip-service
  threads:
    virtual:
      enabled: true
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:pool:postgresql://localhost:5432/ridex}
    username: ${SPRING_R2DBC_USERNAME:ridex}
    password: ${SPRING_R2DBC_PASSWORD:ridex}
  data:
    cassandra:
      contact-points: ${SPRING_DATA_CASSANDRA_CONTACT_POINTS:localhost}
      port: 9042
      keyspace-name: ${SPRING_DATA_CASSANDRA_KEYSPACE_NAME:ridex}
      local-datacenter: ${SPRING_DATA_CASSANDRA_LOCAL_DATACENTER:dc1}
      schema-action: none
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      transaction-id-prefix: trip-tx-
    consumer:
      group-id: trip-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ridex.*

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always

ridex:
  trip:
    timeout-minutes: 10

logging:
  level:
    com.ridex: ${LOG_LEVEL:DEBUG}
