worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream trip_service {
        server trip-service:3001;
    }

    upstream location_service {
        server location-service:3002;
    }

    upstream matching_service {
        server matching-service:3003;
    }

    upstream auth_service {
        server auth-service:3004;
    }

    upstream payment_service {
        server payment-service:3005;
    }

    upstream pricing_service {
        server pricing-service:3006;
    }

    # REST API Gateway
    server {
        listen 8080;
        server_name localhost;

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-RideX-User-Id, X-RideX-Driver-Id, X-RideX-Correlation-Id" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location /api/trips {
            proxy_pass http://trip_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/payments {
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/pricing {
            proxy_pass http://pricing_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/matching {
            proxy_pass http://matching_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/location {
            proxy_pass http://location_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check endpoints
        location /health/trip {
            proxy_pass http://trip_service/actuator/health;
        }
        location /health/location {
            proxy_pass http://location_service/actuator/health;
        }
        location /health/matching {
            proxy_pass http://matching_service/actuator/health;
        }
        location /health/auth {
            proxy_pass http://auth_service/actuator/health;
        }
        location /health/payment {
            proxy_pass http://payment_service/actuator/health;
        }
        location /health/pricing {
            proxy_pass http://pricing_service/actuator/health;
        }
    }

    # WebSocket Gateway
    server {
        listen 8081;
        server_name localhost;

        location /ws/driver {
            proxy_pass http://location_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /ws/rider {
            proxy_pass http://location_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
