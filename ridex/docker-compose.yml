version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ridex-postgres
    environment:
      POSTGRES_DB: ridex
      POSTGRES_USER: ridex
      POSTGRES_PASSWORD: ridex
    ports:
      - "5432:5432"
    volumes:
      - ridex_pgdata:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/seed-data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridex -d ridex"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ridex-net

  redis:
    image: redis:7-alpine
    container_name: ridex-redis
    command: redis-server --appendonly yes --notify-keyspace-events KEx
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ridex-net

  cassandra:
    image: cassandra:4.1
    container_name: ridex-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: ridex-local
      CASSANDRA_DC: dc1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    volumes:
      - ridex_cassandra:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - ridex-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: ridex-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ridex-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: ridex-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - ridex-net

  nginx:
    image: nginx:1.25-alpine
    container_name: ridex-gateway
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - trip-service
      - location-service
      - matching-service
      - auth-service
      - payment-service
      - pricing-service
    networks:
      - ridex-net

  trip-service:
    build:
      context: .
      dockerfile: trip-service/Dockerfile
    container_name: ridex-trip
    ports:
      - "3001:3001"
    environment:
      SPRING_R2DBC_URL: r2dbc:pool:postgresql://postgres:5432/ridex
      SPRING_R2DBC_USERNAME: ridex
      SPRING_R2DBC_PASSWORD: ridex
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_CASSANDRA_CONTACT_POINTS: cassandra
      SPRING_DATA_CASSANDRA_KEYSPACE_NAME: ridex
      SPRING_DATA_CASSANDRA_LOCAL_DATACENTER: dc1
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    networks:
      - ridex-net

  location-service:
    build:
      context: .
      dockerfile: location-service/Dockerfile
    container_name: ridex-location
    ports:
      - "3002:3002"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_CASSANDRA_CONTACT_POINTS: cassandra
      SPRING_DATA_CASSANDRA_KEYSPACE_NAME: ridex
      SPRING_DATA_CASSANDRA_LOCAL_DATACENTER: dc1
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    networks:
      - ridex-net

  matching-service:
    build:
      context: .
      dockerfile: matching-service/Dockerfile
    container_name: ridex-matching
    ports:
      - "3003:3003"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_CASSANDRA_CONTACT_POINTS: cassandra
      SPRING_DATA_CASSANDRA_KEYSPACE_NAME: ridex
      SPRING_DATA_CASSANDRA_LOCAL_DATACENTER: dc1
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    networks:
      - ridex-net

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: ridex-auth
    ports:
      - "3004:3004"
    environment:
      SPRING_R2DBC_URL: r2dbc:pool:postgresql://postgres:5432/ridex
      SPRING_R2DBC_USERNAME: ridex
      SPRING_R2DBC_PASSWORD: ridex
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: local-dev-secret-change-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ridex-net

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: ridex-payment
    ports:
      - "3005:3005"
    environment:
      SPRING_R2DBC_URL: r2dbc:pool:postgresql://postgres:5432/ridex
      SPRING_R2DBC_USERNAME: ridex
      SPRING_R2DBC_PASSWORD: ridex
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      STRIPE_SECRET_KEY: sk_test_placeholder
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ridex-net

  pricing-service:
    build:
      context: .
      dockerfile: pricing-service/Dockerfile
    container_name: ridex-pricing
    ports:
      - "3006:3006"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ridex-net

  ridex-ui:
    build:
      context: ./ridex-ui
      dockerfile: Dockerfile
    container_name: ridex-ui
    ports:
      - "3000:3000"
    depends_on:
      - nginx
    networks:
      - ridex-net

volumes:
  ridex_pgdata:
  ridex_cassandra:

networks:
  ridex-net:
    driver: bridge
