server:
  port: 3002

spring:
  application:
    name: location-service
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
    cassandra:
      contact-points: ${SPRING_DATA_CASSANDRA_CONTACT_POINTS:localhost}
      port: 9042
      keyspace-name: ${SPRING_DATA_CASSANDRA_KEYSPACE_NAME:ridex}
      local-datacenter: ${SPRING_DATA_CASSANDRA_LOCAL_DATACENTER:dc1}
      schema-action: none
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: location-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ridex.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always

ridex:
  location:
    driver-ttl-seconds: 30
    fanout-buffer-size: 1024

logging:
  level:
    com.ridex: ${LOG_LEVEL:DEBUG}
